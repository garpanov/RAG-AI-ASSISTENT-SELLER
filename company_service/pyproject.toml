[project]
name = "example-company-service"
version = "0.1.0"
description = "Standalone example company integration for the AI support platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "ruff>=0.13.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py314"

